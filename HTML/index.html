<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/index.css" />
    <title>ViaHub - Viagens</title>
  </head>
  <body>
    <div class="painel_viahub">
      <header class="topo_viahub">
        <div class="topo_conteudo">
          <strong>ViaHub</strong>
          <h1 id="titulo_viagens">Viagens</h1>
          <button type="button" id="abrir_modal">Nova viagem</button>
        </div>
      </header>
      <main>
        <dialog id="modal_viagem" aria-labelledby="titulo_viagem">
          <h2 id="titulo_viagem">Nova Viagem</h2>
          <form id="form_viagem">
            <div class="campo">
              <label for="destino">Destino</label>
              <input type="text" name="destino" id="destino" required />
            </div>
            <div class="campo">
              <label for="embarque">Local de embarque</label>
              <input type="text" name="embarque" id="embarque" required />
            </div>
            <div class="campo">
              <label for="parada">Parada</label>
              <input type="text" name="parada" id="parada" />
            </div>
            <div id="paradas_extras"></div>
            <button type="button" id="adicionar_parada">
              + Adicionar parada
            </button>
            <div class="campo">
              <label for="data_viagem">Data da viagem</label>
              <input
                type="datetime-local"
                name="data_viagem"
                id="data_viagem"
                required
              />
            </div>
            <div class="campo">
              <label for="termino_viagem">Data e hora de término</label>
              <input
                type="datetime-local"
                name="termino_viagem"
                id="termino_viagem"
                required
              />
            </div>
            <div class="campo">
              <label for="qtde_poltrona">Quantidade de poltronas</label>
              <input
                type="number"
                name="qtde_poltrona"
                id="qtde_poltrona"
                min="1"
                required
              />
            </div>
            <div class="campo">
              <label for="preco_viagem">Preço por pessoa (R$)</label>
              <input type="number" id="preco_viagem" min="0" step="0.01" />
            </div>
            <div class="acoes_reserva">
              <button type="button" id="fechar_modal_viagem">Voltar</button>
              <button type="submit" id="salvar_viagem">Continuar</button>
            </div>
          </form>
        </dialog>
        <section id="painel_detalhes" aria-labelledby="titulo_detalhes" hidden>
          <button type="button" id="voltar_viagens">← Todas as viagens</button>

          <header class="bloco_detalhes resumo_viagem">
            <div class="cabecalho_detalhes">
              <h2 id="titulo_detalhes"></h2>
              <button type="button" id="editar_viagem">Editar viagem</button>
            </div>
            <div class="dados_viagem">
              <p id="data_detalhes"></p>
              <p id="saida_detalhes"></p>
              <p id="preco_detalhes" hidden></p>
            </div>
            <p id="embarque_detalhes"></p>
          </header>

          <dl class="indicadores_viagem">
            <div class="bloco_detalhes">
              <dt>Reservas ativas</dt>
              <dd id="total_reservas">0</dd>
            </div>
            <div class="bloco_detalhes">
              <dt>Poltronas disponíveis</dt>
              <dd id="total_disponiveis">0</dd>
            </div>
            <div class="bloco_detalhes">
              <dt>Pagamentos pendentes</dt>
              <dd id="total_pendentes">0</dd>
            </div>
            <div class="bloco_detalhes">
              <dt>Pagamentos confirmados</dt>
              <dd id="total_confirmados">0</dd>
            </div>
          </dl>

          <div class="bloco_detalhes painel_ocupacao">
            <div class="cabecalho_detalhes">
              <strong id="ocupacao_detalhes" role="status"></strong>
              <span id="percentual_ocupacao"></span>
            </div>
            <meter id="barra_ocupacao" aria-label="Ocupação do ônibus"></meter>
          </div>

          <div class="grade_detalhes">
            <section class="bloco_detalhes" aria-labelledby="titulo_mapa">
              <div class="cabecalho_detalhes">
                <h3 id="titulo_mapa">Mapa de poltronas</h3>
                <span id="total_lugares"></span>
              </div>
              <div class="onibus">
                <p class="frente_onibus">Frente do ônibus</p>
                <ol id="mapa_poltronas" aria-label="Poltronas do ônibus"></ol>
              </div>
              <div class="legenda_poltronas">
                <span>Livre</span>
                <span class="legenda_ocupada">Ocupada</span>
              </div>
            </section>

            <section class="bloco_detalhes" aria-labelledby="titulo_passageiros">
              <div class="cabecalho_detalhes">
                <h3 id="titulo_passageiros">Passageiros</h3>
                <span id="total_passageiros" class="selo_detalhes"></span>
              </div>
              <input type="search" id="buscar_passageiro" aria-label="Buscar por nome ou poltrona" placeholder="Buscar por nome ou poltrona" />
              <div class="filtros_passageiros" id="filtros_passageiros" role="group" aria-label="Filtrar reservas">
                <button type="button" data-filtro="ativas" aria-pressed="true">Ativas</button>
                <button type="button" data-filtro="pendentes" aria-pressed="false">Pendentes</button>
                <button type="button" data-filtro="confirmados" aria-pressed="false">Confirmados</button>
                <button type="button" data-filtro="canceladas" aria-pressed="false">Canceladas</button>
              </div>
              <p id="passageiros_vazio" class="passageiros_vazio" role="status" hidden></p>
              <ul id="lista_passageiros" aria-label="Reservas da viagem"></ul>
            </section>
          </div>
          <dialog id="modal_reserva" aria-labelledby="titulo_reserva">
            <h2 id="titulo_reserva"></h2>

            <form id="form_reserva">
              <label class="campo">
                Nome do passageiro
                <input type="text" name="nome" required />
              </label>

              <label class="campo">
                WhatsApp
                <input type="tel" name="telefone" required />
              </label>

            </form>

            <form method="dialog" class="acoes_reserva">
              <button type="submit">Voltar ao mapa</button>
              <button type="submit" form="form_reserva">Salvar reserva</button>
            </form>
          </dialog>
          <div class="acoes_detalhes">
            <button type="button" id="cancelar_viagem">Cancelar viagem</button>
          </div>
        </section>

        <section
          id="painel_lista"
          aria-labelledby="titulo_viagens"
        >
          <div id="lista_viagens"></div>
        </section>
      </main>
    </div>
    <script src="../JS/armazenamento.js"></script>
    <script src="../JS/viagens.js"></script>
    <script src="../JS/index.js"></script>
  </body>
</html>
