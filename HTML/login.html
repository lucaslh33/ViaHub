<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExcursãoPro - Login</title>
</head>
<body>
    <main>
        <form class="container" method="post">
            <h1>Bem vindo a tela de Login</h1>
            <div class="campo">
                <label for="email_login">E-mail:</label>
                <input type="email" name="email_login" id="email_login" required>
            </div>
            <div class="campo">
                <label for="senha_login">Senha:</label>
                <input type="password" name="senha_login" id="senha_login" required>
            </div>
            <button>Continuar</button>
            <a href="">Esqueci minha senha</a>
            <p>Não possui conta? <a href="cadastro.html">Cadastre-se</a></p>
        </form>

        <section >
            <button type="submit">Login com o Google</button>
        </section>
    </main>
    <script src="../JS/login.js"></script>
</body>
</html>
